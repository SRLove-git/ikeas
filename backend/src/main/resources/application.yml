server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ikea-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:buzud}
    username: ${DB_USER:buzud}
    password: ${DB_PASSWORD:buzud}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ikea.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ikea:
  cors:
    # Comma-separated origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  static:
    # Optional: serve /images, /seo and /fonts from the repo's public dir, e.g.
    # IKEA_STATIC_PUBLIC_DIR=../public. Leave empty to disable.
    public-dir: ${IKEA_STATIC_PUBLIC_DIR:}
  oss:
    # Aliyun OSS storage for admin uploads. Disabled by default until credentials are configured.
    enabled: ${IKEA_OSS_ENABLED:false}
    endpoint: ${IKEA_OSS_ENDPOINT:}
    bucket: ${IKEA_OSS_BUCKET:}
    access-key-id: ${IKEA_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${IKEA_OSS_ACCESS_KEY_SECRET:}
    public-url-base: ${IKEA_OSS_PUBLIC_URL_BASE:}
    max-size-bytes: ${IKEA_OSS_MAX_SIZE_BYTES:20971520}
  auth:
    # HMAC secret used to sign access JWTs. Must be at least 32 bytes in production.
    jwt-secret: ${IKEA_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    # Access token lifetime in seconds (default 15 minutes).
    access-token-ttl: ${IKEA_ACCESS_TOKEN_TTL:900}
    # Refresh token lifetime in seconds (default 30 days).
    refresh-token-ttl: ${IKEA_REFRESH_TOKEN_TTL:2592000}
    # Demo mode: return the SMS code in the API response (IKEA_EXPOSE_SMS_CODE=false to hide).
    expose-sms-code: ${IKEA_EXPOSE_SMS_CODE:true}
  admin:
    # Shared key for /api/v1/admin/** endpoints, sent as X-Admin-Key (IKEA_ADMIN_KEY).
    key: ${IKEA_ADMIN_KEY:ikea-admin}
  order:
    # Default delivery fee in SGD when the client does not pass one.
    default-delivery-fee: ${IKEA_DEFAULT_DELIVERY_FEE:9.9}
  oms:
    # OMS 对接开关（对接规范 §4.1）：默认 false = 商城独立运行，不装配 OMS 组件。
    enabled: ${BUZUD_OMS_ENABLED:false}
    gateway-url: ${BUZUD_OMS_GATEWAY_URL:http://localhost:8080}
    app-id: ${BUZUD_OMS_APP_ID:}
    # 生产环境通过 K8s Secret/配置中心注入，禁止进入前端构建产物。
    app-secret: ${BUZUD_OMS_APP_SECRET:}
    merchant-id: ${BUZUD_OMS_MERCHANT_ID:}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    # 下单同步重试上限，超过转失败人工处理。
    max-retries: 3
    # BUZUD 零售订单固定 B2C。
    order-type: 2
    status-sync:
      enabled: true
      # 轮询间隔，遵循 OMS 约定 ≥ 5s。
      interval-ms: 5000
      batch-size: 100
    product-sync:
      enabled: true
      # 商品/库存快照刷新间隔（短 TTL）。
      interval-ms: 60000
      page-size: 100
  chat-knowledge:
    # Optional external chat knowledge JSON (IKEA_CHAT_KNOWLEDGE_FILE), reloaded on change.
    file: ${IKEA_CHAT_KNOWLEDGE_FILE:}
