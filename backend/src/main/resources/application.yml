server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ikea-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:buzud}
    username: ${DB_USER:buzud}
    password: ${DB_PASSWORD:buzud}
    driver-class-name: org.postgresql.Driver
  mail:
    host: smtpdm.aliyun.com
    port: 465
    username: no-reply@mail.medical-sg.com
    password: ${IKEA_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ikea.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ikea:
  cors:
    # Comma-separated origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  static:
    # Optional: serve /images, /seo and /fonts from the repo's public dir, e.g.
    # IKEA_STATIC_PUBLIC_DIR=../public. Leave empty to disable.
    public-dir: ${IKEA_STATIC_PUBLIC_DIR:}
  oss:
    # Aliyun OSS storage for admin uploads. Disabled by default until credentials are configured.
    enabled: ${IKEA_OSS_ENABLED:false}
    endpoint: ${IKEA_OSS_ENDPOINT:}
    bucket: ${IKEA_OSS_BUCKET:}
    access-key-id: ${IKEA_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${IKEA_OSS_ACCESS_KEY_SECRET:}
    public-url-base: ${IKEA_OSS_PUBLIC_URL_BASE:}
    max-size-bytes: ${IKEA_OSS_MAX_SIZE_BYTES:20971520}
  auth:
    # HMAC secret used to sign access JWTs. Must be at least 32 bytes in production.
    jwt-secret: ${IKEA_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    # Access token lifetime in seconds (default 15 minutes).
    access-token-ttl: ${IKEA_ACCESS_TOKEN_TTL:900}
    # Refresh token lifetime in seconds (default 30 days).
    refresh-token-ttl: ${IKEA_REFRESH_TOKEN_TTL:2592000}
    # 登录/注册开关：线下活动阶段可关闭。
    login-enabled: ${IKEA_AUTH_LOGIN_ENABLED:true}
    # Sender address for registration verification emails.
    email-from: ${IKEA_MAIL_FROM:CHUNG YIP <no-reply@mail.medical-sg.com>}
  admin:
    # Shared key for /api/v1/admin/** endpoints, sent as X-Admin-Key (IKEA_ADMIN_KEY).
    key: ${IKEA_ADMIN_KEY:ikea-admin}
  shipping:
    # J&T Singapore standard service shown at cart/checkout and enforced at order creation.
    # Update this value from the merchant VIP "Freight inquiry" result when the contract rate changes.
    carrier: ${IKEA_SHIPPING_CARRIER:J&T Express Singapore}
    service-code: ${IKEA_SHIPPING_SERVICE_CODE:EXPRESS}
    standard-delivery-fee: ${IKEA_JT_STANDARD_DELIVERY_FEE:4.90}
  voucher:
    # 打印券二维码指向的预约页，通常生产环境保持 medical-sg.com。
    booking-url: ${BUZUD_VOUCHER_BOOKING_URL:https://medical-sg.com/zh/booking/}
  marketing:
    # 扫码领券二维码指向的前台域名，部署时配置为公网地址。
    public-base-url: ${BUZUD_MARKETING_PUBLIC_BASE_URL:https://medical-sg.com}
  payment:
    # 商城收银台：true=本地模拟支付；false=尝试真实托管收银台。
    mock-only: ${IKEA_PAYMENT_MOCK_ONLY:true}
    yeahpay:
      # 需完成 YeahPay API 开通与出口 IP 白名单；notify-url 随每次创建收银台请求发送。
      enabled: ${IKEA_YEAHPAY_ENABLED:false}
      # 默认统一使用 H5；确认 PC 收银台可用后才显式开启。
      pc-checkout-enabled: ${IKEA_YEAHPAY_PC_CHECKOUT_ENABLED:false}
      app-id: ${IKEA_YEAHPAY_APP_ID:}
      api-key: ${IKEA_YEAHPAY_API_KEY:}
      merchant-id: ${IKEA_YEAHPAY_MERCHANT_ID:}
      api-base-url: ${IKEA_YEAHPAY_API_BASE_URL:https://open-api.yeahpay.sg/acceptance/acceptance-open-api}
      signature-domain: ${IKEA_YEAHPAY_SIGNATURE_DOMAIN:https://open-api.yeahpay.sg/acceptance}
      callback-url: ${IKEA_YEAHPAY_CALLBACK_URL:https://medical-sg.com/zh/profile/my-orders?payment=success}
      notify-url: ${IKEA_YEAHPAY_NOTIFY_URL:https://medical-sg.com/api/v1/payment/yeahpay/webhook}
      lang: ${IKEA_YEAHPAY_LANG:en}
      # 只向前端开放商户已实际开通的方式。前三项使用 unifiedOrder 直连二维码。
      enabled-methods: ${IKEA_YEAHPAY_ENABLED_METHODS:paynow,wechatpay,alipay,visa,mastercard,amex}
      connect-timeout-ms: ${IKEA_YEAHPAY_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${IKEA_YEAHPAY_READ_TIMEOUT_MS:20000}
      callback-replay-window-seconds: ${IKEA_YEAHPAY_CALLBACK_REPLAY_WINDOW_SECONDS:300}
    stripe:
      public-key: ${IKEA_STRIPE_PUBLIC_KEY:}
      secret-key: ${IKEA_STRIPE_SECRET_KEY:}
      webhook-secret: ${IKEA_STRIPE_WEBHOOK_SECRET:}
      api-base-url: ${IKEA_STRIPE_API_BASE_URL:https://api.stripe.com}
      return-url-base: ${IKEA_STRIPE_RETURN_URL_BASE:http://localhost:3000}
      success-path: ${IKEA_STRIPE_SUCCESS_PATH:/zh/profile/my-orders?payment=success}
      cancel-path: ${IKEA_STRIPE_CANCEL_PATH:/zh/pay/cart?payment=cancel}
  notification:
    stock-webhook-url: ${IKEA_NOTIFICATION_STOCK_WEBHOOK_URL:}
  oms:
    # OMS 对接开关（对接规范 §4.1）：默认 false = 商城独立运行，不装配 OMS 组件。
    enabled: ${BUZUD_OMS_ENABLED:false}
    callback-secret: ${BUZUD_OMS_CALLBACK_SECRET:demo-mall-callback-secret-change-me}
    callback-timestamp-window-seconds: ${BUZUD_OMS_CALLBACK_TIMESTAMP_WINDOW_SECONDS:300}
    gateway-url: ${BUZUD_OMS_GATEWAY_URL:http://localhost:8080}
    app-id: ${BUZUD_OMS_APP_ID:}
    # 生产环境通过 K8s Secret/配置中心注入，禁止进入前端构建产物。
    app-secret: ${BUZUD_OMS_APP_SECRET:}
    merchant-id: ${BUZUD_OMS_MERCHANT_ID:}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    # 下单同步重试上限，超过转失败人工处理。
    max-retries: 3
    # BUZUD 零售订单固定 B2C。
    order-type: 2
    status-sync:
      enabled: true
      # 轮询间隔，遵循 OMS 约定 ≥ 5s。
      interval-ms: 5000
      batch-size: 100
    product-sync:
      enabled: true
      # 商品/库存快照刷新间隔（短 TTL）。
      interval-ms: 60000
      page-size: 100
  chat-knowledge:
    # Optional external chat knowledge JSON (IKEA_CHAT_KNOWLEDGE_FILE), reloaded on change.
    file: ${IKEA_CHAT_KNOWLEDGE_FILE:}

oms:
  integration:
    notification:
      provider: smtp
      reply-to: support@medical-sg.com
