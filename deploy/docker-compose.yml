name: buzud

# ===== 三站点前端 =====
# 同一份代码、同一套后端/数据库，按 NEXT_PUBLIC_SITE_SCOPE 构建三个镜像：
#   app        -> medical-sg.com  医疗站（医疗组商品）
#   app-home   -> home-sg.com     家庭站（东芝/美的家电）
#   app-portal -> life-sg.com     品牌门户 + 统一会员/订单中心
# 账号、订单、支付、库存全部走同一个 buzud-server / PostgreSQL / OMS。

x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
  NEXT_PUBLIC_AUTH_LOGIN_ENABLED: ${NEXT_PUBLIC_AUTH_LOGIN_ENABLED:-true}
  NEXT_PUBLIC_MEDICAL_URL: ${NEXT_PUBLIC_MEDICAL_URL:-https://medical-sg.com}
  NEXT_PUBLIC_HOME_URL: ${NEXT_PUBLIC_HOME_URL:-https://home-sg.com}
  NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://life-sg.com}

x-frontend-common: &frontend-common
  restart: unless-stopped
  env_file:
    - path: ../.env.local
      required: false
    - path: ../.env
      required: false
  volumes:
    - /opt/buzud/cms-data:/app/src/data
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

x-frontend-environment: &frontend-environment
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
  NEXT_PUBLIC_AUTH_LOGIN_ENABLED: ${NEXT_PUBLIC_AUTH_LOGIN_ENABLED:-true}
  NEXT_PUBLIC_MEDICAL_URL: ${NEXT_PUBLIC_MEDICAL_URL:-https://medical-sg.com}
  NEXT_PUBLIC_HOME_URL: ${NEXT_PUBLIC_HOME_URL:-https://home-sg.com}
  NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://life-sg.com}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
  ADMIN_SECRET: ${ADMIN_SECRET:-ikea-admin-secret}

services:
  app:
    <<: *frontend-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runner
      args:
        <<: *frontend-build-args
        NEXT_PUBLIC_SITE_SCOPE: medical
        NEXT_PUBLIC_SITE_URL: https://medical-sg.com
        NEXT_PUBLIC_API_BASE: https://medical-sg.com
    image: buzud-frontend-medical:latest
    container_name: buzud-frontend-medical
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${PORT:-3100}:3000"
    environment:
      <<: *frontend-environment
      NEXT_PUBLIC_SITE_SCOPE: medical
      NEXT_PUBLIC_SITE_URL: https://medical-sg.com
      NEXT_PUBLIC_API_BASE: https://medical-sg.com

  app-home:
    <<: *frontend-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runner
      args:
        <<: *frontend-build-args
        NEXT_PUBLIC_SITE_SCOPE: home
        NEXT_PUBLIC_SITE_URL: https://home-sg.com
        NEXT_PUBLIC_API_BASE: https://home-sg.com
    image: buzud-frontend-home:latest
    container_name: buzud-frontend-home
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${HOME_APP_PORT:-3101}:3000"
    environment:
      <<: *frontend-environment
      NEXT_PUBLIC_SITE_SCOPE: home
      NEXT_PUBLIC_SITE_URL: https://home-sg.com
      NEXT_PUBLIC_API_BASE: https://home-sg.com

  app-portal:
    <<: *frontend-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runner
      args:
        <<: *frontend-build-args
        NEXT_PUBLIC_SITE_SCOPE: portal
        NEXT_PUBLIC_SITE_URL: https://life-sg.com
        NEXT_PUBLIC_API_BASE: https://life-sg.com
    image: buzud-frontend-portal:latest
    container_name: buzud-frontend-portal
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${PORTAL_APP_PORT:-3102}:3000"
    environment:
      <<: *frontend-environment
      NEXT_PUBLIC_SITE_SCOPE: portal
      NEXT_PUBLIC_SITE_URL: https://life-sg.com
      NEXT_PUBLIC_API_BASE: https://life-sg.com

  dev:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    image: ai-website-cloner:dev
    container_name: ai-website-cloner-dev
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: ../.env.local
        required: false
      - path: ../.env
        required: false
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  buzud-server:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: buzud-server:latest
    container_name: buzud-server
    restart: unless-stopped
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    environment:
      - IKEA_STATIC_PUBLIC_DIR=${IKEA_STATIC_PUBLIC_DIR:-/app/frontend/public}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://47.84.25.19:3001,https://life-sg.com,https://www.life-sg.com,https://medical-sg.com,https://www.medical-sg.com,https://home-sg.com,https://www.home-sg.com}
      - IKEA_OSS_ENABLED=${IKEA_OSS_ENABLED:-false}
      - IKEA_OSS_ENDPOINT=${IKEA_OSS_ENDPOINT:-}
      - IKEA_OSS_BUCKET=${IKEA_OSS_BUCKET:-}
      - IKEA_OSS_ACCESS_KEY_ID=${IKEA_OSS_ACCESS_KEY_ID:-}
      - IKEA_OSS_ACCESS_KEY_SECRET=${IKEA_OSS_ACCESS_KEY_SECRET:-}
      - IKEA_OSS_PUBLIC_URL_BASE=${IKEA_OSS_PUBLIC_URL_BASE:-}
      - IKEA_OSS_MAX_SIZE_BYTES=${IKEA_OSS_MAX_SIZE_BYTES:-20971520}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=buzud
      - DB_USER=buzud
      - DB_PASSWORD=${DB_PASSWORD:-buzud}
      - IKEA_JWT_SECRET=${IKEA_JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-bytes}
      - IKEA_MAIL_USERNAME=${IKEA_MAIL_USERNAME:-no-reply@mail.life-sg.com}
      - IKEA_MAIL_PASSWORD=${IKEA_MAIL_PASSWORD:-}
      - 'IKEA_MAIL_FROM=${IKEA_MAIL_FROM:-CHUNG YIP <no-reply@mail.life-sg.com>}'
      - IKEA_AUTH_LOGIN_ENABLED=${IKEA_AUTH_LOGIN_ENABLED:-true}
      - IKEA_SHIPPING_CARRIER=${IKEA_SHIPPING_CARRIER:-J&T Express Singapore}
      - IKEA_SHIPPING_SERVICE_CODE=${IKEA_SHIPPING_SERVICE_CODE:-EXPRESS}
      - IKEA_JT_STANDARD_DELIVERY_FEE=${IKEA_JT_STANDARD_DELIVERY_FEE:-4.90}
      - IKEA_PAYMENT_MOCK_ONLY=${IKEA_PAYMENT_MOCK_ONLY:-true}
      - IKEA_YEAHPAY_ENABLED=${IKEA_YEAHPAY_ENABLED:-false}
      - IKEA_YEAHPAY_PC_CHECKOUT_ENABLED=${IKEA_YEAHPAY_PC_CHECKOUT_ENABLED:-false}
      - IKEA_YEAHPAY_APP_ID=${IKEA_YEAHPAY_APP_ID:-}
      - IKEA_YEAHPAY_API_KEY=${IKEA_YEAHPAY_API_KEY:-}
      - IKEA_YEAHPAY_MERCHANT_ID=${IKEA_YEAHPAY_MERCHANT_ID:-}
      - IKEA_YEAHPAY_API_BASE_URL=${IKEA_YEAHPAY_API_BASE_URL:-https://open-api.yeahpay.sg/acceptance/acceptance-open-api}
      - IKEA_YEAHPAY_SIGNATURE_DOMAIN=${IKEA_YEAHPAY_SIGNATURE_DOMAIN:-https://open-api.yeahpay.sg/acceptance}
      - IKEA_YEAHPAY_CALLBACK_URL=${IKEA_YEAHPAY_CALLBACK_URL:-https://life-sg.com/zh/profile/my-orders?payment=success}
      - IKEA_YEAHPAY_NOTIFY_URL=${IKEA_YEAHPAY_NOTIFY_URL:-https://life-sg.com/api/v1/payment/yeahpay/webhook}
      - IKEA_YEAHPAY_LANG=${IKEA_YEAHPAY_LANG:-en}
      - IKEA_YEAHPAY_ENABLED_METHODS=${IKEA_YEAHPAY_ENABLED_METHODS:-paynow,wechatpay,alipay,visa,mastercard,amex}
      - IKEA_STRIPE_RETURN_URL_BASE=${IKEA_STRIPE_RETURN_URL_BASE:-https://life-sg.com}
      - BUZUD_SITE_MEDICAL_URL=${BUZUD_SITE_MEDICAL_URL:-https://medical-sg.com}
      - BUZUD_SITE_HOME_URL=${BUZUD_SITE_HOME_URL:-https://home-sg.com}
      - BUZUD_SITE_PORTAL_URL=${BUZUD_SITE_PORTAL_URL:-https://life-sg.com}
      - BUZUD_OMS_ENABLED=${BUZUD_OMS_ENABLED:-false}
      - BUZUD_OMS_CALLBACK_SECRET=${BUZUD_OMS_CALLBACK_SECRET:-}
      - BUZUD_OMS_GATEWAY_URL=${BUZUD_OMS_GATEWAY_URL:-http://localhost:8080}
      - BUZUD_OMS_APP_ID=${BUZUD_OMS_APP_ID:-}
      - BUZUD_OMS_APP_SECRET=${BUZUD_OMS_APP_SECRET:-}
      - BUZUD_OMS_MERCHANT_ID=${BUZUD_OMS_MERCHANT_ID:-}
      - BUZUD_VOUCHER_BOOKING_URL=${BUZUD_VOUCHER_BOOKING_URL:-https://medical-sg.com/zh/booking/}
      - BUZUD_VOUCHER_POINTS_REDEEM_URL=${BUZUD_VOUCHER_POINTS_REDEEM_URL:-https://life-sg.com/zh/profile/}
      - BUZUD_MARKETING_PUBLIC_BASE_URL=${BUZUD_MARKETING_PUBLIC_BASE_URL:-https://life-sg.com}
      - OMS_INTEGRATION_NOTIFICATION_REPLY_TO=${OMS_INTEGRATION_NOTIFICATION_REPLY_TO:-support@life-sg.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../frontend/public:/app/frontend/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16
    container_name: buzud-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=buzud
      - POSTGRES_USER=buzud
      - POSTGRES_PASSWORD=${DB_PASSWORD:-buzud}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - buzud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzud -d buzud"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  buzud_pgdata:
